{% extends "layout.html" %}
{% block title %}
Add Budget Item{% endblock %}
{% block content %}
    <div class="container">
        <h1>Add Budget Item</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Add Item</button>
            <a href="{% url 'budget_page' %}" class="btn btn-success">
            Cancel
        </a>
        </form>
    </div>
{% endblock %}
